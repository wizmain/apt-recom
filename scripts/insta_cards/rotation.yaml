# 인스타 데일리 로테이션 설정 (Phase 0 — 수동 파일럿)
#
# 목적: 발행일 → (series, 파라미터, slug, 생성 명령)을 결정론적으로 산출한다.
# 리졸버: scripts/insta_cards/rotation.py (`python -m scripts.insta_cards.rotation [YYYY-MM-DD]`)
# 관련 PRD: docs/prd/2026-07-24-instagram-daily-content.md (§5·§9-2)
#
# 편집 규칙:
# - 지역/파라미터는 편집 대상. 큐를 늘리면 동일(포맷,지역) 재등장 간격이 늘어난다(PRD §5-2, 목표 ≥8).
# - trade_top 은 전국(지역 파라미터 없음) — Phase 0 확정(월요일 1회, 주말 재배치).
# - value 의 --region 은 한글 키워드라 slug 가 romanized 필요 → 각 항목에 slug 동봉.

timezone: Asia/Seoul
# 날짜→인덱스 기준일(포함). 요일 계산에도 사용. 파일럿 시작일로 갱신 가능.
anchor_date: "2026-07-27"   # 파일럿 1일차(월) — 14회 창: 2026-07-27 ~ 2026-08-09

# 요일(mon..sun) → series. Phase 0: trade_top 월 1회, 주말은 지역 로테이션 포맷으로.
weekday_format:
  mon: trade_top
  tue: value
  wed: compare
  thu: lifestyle
  fri: budget_choice
  sat: value
  sun: lifestyle

# 시리즈별 파라미터 큐 (occurrence index 로 순환).
series:
  trade_top:
    # 전국 · 최근 N일 적재분 최고가. 지역 파라미터 없음.
    days: 7
    # 최소 세대수. 없으면 14세대급 부티크 빌라가 대단지와 나란히 최고가로 실린다
    # (2026-07-26 파일럿 1일차 검수: 이니그마빌 14세대가 3위). CLI 기본값(100)과
    # 같은 값이지만, 정책값은 여기서 명시적으로 선언한다.
    min_hhld: 100

  value:
    # --region 은 키워드(자치구명). slug 는 romanized 고정.
    nudge: cost
    # 단지에서 가장 작은 주택형의 하한(㎡) — 모든 주택형이 이 값 이상인 단지만.
    # 없으면 ㎡당 가격 오름차순이 오피스텔·도시형생활주택 단지를 상위로 끌어올려
    # "가성비 아파트" 훅과 실제 물건이 어긋난다 (2026-07-25 파일럿 1일차 검수:
    # 강남구 5곳 전부가 전용 20~55㎡ 소형이었다).
    # 59 = 최소 주택형이 국민주택 규모 하단 이상. 이 값이 정책의 단일 출처다
    # (CLI 는 value 시리즈에 --min-smallest-area 를 필수로 요구).
    min_smallest_area: 59
    regions:
      - { keyword: "강남구", slug: gangnam }
      - { keyword: "서초구", slug: seocho }
      - { keyword: "송파구", slug: songpa }
      - { keyword: "마포구", slug: mapo }
      - { keyword: "성동구", slug: seongdong }
      - { keyword: "용산구", slug: yongsan }
      - { keyword: "양천구", slug: yangcheon }
      - { keyword: "노원구", slug: nowon }
      - { keyword: "광진구", slug: gwangjin }
      - { keyword: "강동구", slug: gangdong }

  compare:
    # 시군구 코드 2개(콤마). slug 는 코드 기반 자동 생성.
    nudge: newlywed
    # 최소 세대수. 없으면 넛지 점수 상위에 17~21세대 빌라급 단지가 올라와 지역
    # 대표 단지로 실린다 (2026-07-29 파일럿 3일차 검수: 성동구 1위가 17세대 '드림',
    # 2위가 21세대 '상왕'). 상위10 평균 점수도 같이 왜곡된다.
    # trade_top 과 같은 값이지만, 정책값은 시리즈별로 명시 선언한다.
    min_hhld: 100
    # 큐 순서 주의: 앵커(7/27) 기준 첫 compare 는 이 목록의 0번이다. 파일럿 직전
    # 수동 발행분(2026-07-17 마포 vs 성동)과 겹치지 않도록 해당 쌍을 뒤로 돌렸다
    # (PRD §5-2 동일 (포맷,지역) 재등장 ≥8주).
    pairs:
      - "11710,11740"   # 송파구 vs 강동구
      - "11680,11650"   # 강남구 vs 서초구
      - "11470,11560"   # 양천구 vs 영등포구
      - "11350,11215"   # 노원구 vs 광진구
      - "11170,11440"   # 용산구 vs 마포구
      - "11590,11560"   # 동작구 vs 영등포구
      - "11200,11215"   # 성동구 vs 광진구
      - "11440,11200"   # 마포구 vs 성동구 (2026-07-17 발행분과 동일 — 큐 마지막)

  lifestyle:
    # profile(넛지) × region(코드). idx 로 각각 순환.
    # 최소 세대수. 생성기는 넛지 payload·select_candidates 로 이미 하한을 적용하지만,
    # 값이 CLI 기본값에만 의존하면 정책 출처가 흩어진다(2026-07-29 정렬).
    # trade_top·compare 와 같은 값이지만 시리즈별로 명시 선언한다.
    min_hhld: 100
    profiles: [pet, newlywed, senior, education, safety]
    regions:
      - "11680"  # 강남구
      - "11650"  # 서초구
      - "11710"  # 송파구
      - "11440"  # 마포구
      - "11200"  # 성동구
      - "11170"  # 용산구
      - "11470"  # 양천구
      - "11350"  # 노원구

  budget_choice:
    # 코드쌍 + 예산(만원) + 면적. 전량 --dry-run 검증(2026-07-24) 통과한 조합만 유지.
    # 데이터 주의: 경기 외곽(분당 41135·화성 41590) 84㎡ 밴드는 최근 90일 계약이 얇아 제외됨.
    # 편집 시 반드시 --dry-run 으로 양쪽 지역 데이터 존재를 확인할 것(PRD §9-3, 런북 2단계).
    items:
      - { regions: "11350,41463", budget: 60000, area_a: 59, area_b: 59 }   # 노원 vs 용인기흥 · 6억 · 59㎡
      - { regions: "11215,41173", budget: 80000, area_a: 84, area_b: 84 }   # 광진 vs 안양동안 · 8억 · 84㎡
      - { regions: "11560,41111", budget: 70000, area_a: 59, area_b: 59 }   # 영등포 vs 수원장안 · 7억 · 59㎡
      - { regions: "11170,41131", budget: 90000, area_a: 59, area_b: 59 }   # 용산 vs 성남수정 · 9억 · 59㎡
      - { regions: "11440,11200", budget: 90000, area_a: 84, area_b: 84 }   # 마포 vs 성동 · 9억 · 84㎡
      - { regions: "11350,11470", budget: 60000, area_a: 59, area_b: 59 }   # 노원 vs 양천 · 6억 · 59㎡
