name: Trade Data Batch (12h)

on:
  schedule:
    - cron: '0 3,15 * * *'  # 매일 03:00/15:00 UTC (한국 12:00/00:00)
  workflow_dispatch:

jobs:
  batch:
    runs-on: ubuntu-latest
    # 올리지 말 것 — 수집은 batch.config.COLLECT_BUDGET_MINUTES(35분)로 자체 상한을 갖는다.
    # 예산 35 + 체크 간격 초과분 1 + 후속 단계 약 7 = 약 43분. 이 값을 넘긴다면 원인은
    # 수집 시간이 아니라 후속 단계이므로, 벽을 옮기지 말고 그쪽을 봐야 한다.
    # 배경: docs/batch-operations.md '거래 수집의 시간 예산'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install psycopg2-binary requests python-dotenv pandas joblib numpy scikit-learn
      # 진단 전용 — 실패해도 배치는 돈다. 9/20~10/12 에 회차 단위로 apis.data.go.kr
      # ConnectTimeout 100% 가 반복됐고(리전·시각 무관, 0% 아니면 100%) 러너 IP 차단이
      # 추정 원인이다. 실패 회차의 출발 IP 와 연결 결과를 짝지어 확증하기 위한 기록.
      # 배경: docs/batch-operations.md '연결 불가 조기 중단'
      - name: Diagnose data.go.kr reachability
        continue-on-error: true
        run: |
          echo "runner public ip: $(curl -s -m 10 https://api.ipify.org || echo unknown)"
          curl -s -o /dev/null -m 20 --connect-timeout 15 \
            -w 'apis.data.go.kr connect=%{time_connect}s http=%{http_code} ip=%{remote_ip}\n' \
            https://apis.data.go.kr/ || echo "apis.data.go.kr unreachable (curl exit $?)"
      - name: Run trade batch
        run: python -m batch.run --type trade
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          # 신규 아파트 건축물대장 즉시 등록(6b)의 429 키 로테이션 풀
          DATA_GO_KR_API_SECONDARY_KEY: ${{ secrets.DATA_GO_KR_API_SECONDARY_KEY }}
          DATA_GO_KR_API_THIRD_KEY: ${{ secrets.DATA_GO_KR_API_THIRD_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
