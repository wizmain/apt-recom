name: CI Scripts Tests

# scripts/ 의 Python 테스트를 돌린다. 이 저장소에는 Python 테스트를 실행하는
# 워크플로가 없었고(2026-07-27 확인), 인스타 카드 생성기는 사람이 수동 실행하는
# 도구라 회귀가 발행 직전 검수까지 드러나지 않았다. 파일럿을 Phase 1(생성·PR
# 자동화)로 옮기면 그 검수가 줄어들므로 안전망을 먼저 세운다.
#
# web/backend/tests/test_core.py 는 여기서 돌리지 않는다 — 라이브 DB 연결이
# 필요하고(CLAUDE.md 테스트 절), CI 에 운영 DB 자격증명을 노출하지 않는다.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/ci-scripts-tests.yml"
      # 복제 수식 일치 테스트(test_scoring_formula_consistency.py)의 비교 대상 —
      # 어느 한쪽만 수정된 PR 에서도 드리프트 검증이 돌아야 한다.
      - "web/backend/services/scoring.py"
      - "batch/ml/apply_curves.py"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/ci-scripts-tests.yml"
      - "web/backend/services/scoring.py"
      - "batch/ml/apply_curves.py"

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify font metrics match the reference
        # 폰트는 렌더링뿐 아니라 텍스트 한도 검증의 입력이다(theme.py 주석).
        # 폭이 환경마다 달라지면 같은 문구가 환경에 따라 통과/실패해 초록불이
        # 실제 안전을 보장하지 못한다. 그래서 파일 존재만이 아니라 측정값이
        # 로컬 기준값과 일치하는지까지 확인하고, 어긋나면 테스트 전에 멈춘다.
        run: |
          python - <<'PY'
          from PIL import features
          from scripts.insta_cards import theme

          SAMPLE = "최근 7일 새로 포착된 최고가는 57억 5,000만원"
          EXPECTED = 1412  # macOS 로컬 기준값 (Pillow 12.1.1 / 12.3.0 동일)

          width = theme.get_font("extrabold", 72).getlength(SAMPLE)
          print(f"font    : {theme.FONT_PATH}")
          print(f"freetype: {features.version('freetype2')} / raqm={features.check('raqm')}")
          print(f"샘플 폭 : {width:.0f}px (기준 {EXPECTED}px)")
          assert round(width) == EXPECTED, (
              f"폰트 폭이 기준과 다름: {width:.0f} != {EXPECTED}. "
              "레이아웃 엔진이나 폰트 파일이 로컬과 갈라졌다는 뜻이므로 "
              "scripts/insta_cards/assets/fonts/README.md 교체 절차를 확인할 것."
          )
          PY
      - name: Run script tests
        # DB·네트워크 의존 없음 — 외부 호출은 전부 테스트에서 patch 된다.
        run: python -m unittest discover -s scripts/tests -t . -v
