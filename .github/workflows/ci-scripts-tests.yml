name: CI Scripts Tests

# scripts/ 의 Python 테스트를 돌린다. 이 저장소에는 Python 테스트를 실행하는
# 워크플로가 없었고(2026-07-27 확인), 인스타 카드 생성기는 사람이 수동 실행하는
# 도구라 회귀가 발행 직전 검수까지 드러나지 않았다. 파일럿을 Phase 1(생성·PR
# 자동화)로 옮기면 그 검수가 줄어들므로 안전망을 먼저 세운다.
#
# web/backend/tests/test_core.py 는 여기서 돌리지 않는다 — 라이브 DB 연결이
# 필요하고(CLAUDE.md 테스트 절), CI 에 운영 DB 자격증명을 노출하지 않는다.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/ci-scripts-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/ci-scripts-tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify bundled font is usable
        # 폰트는 렌더링뿐 아니라 텍스트 한도 검증의 입력이다(theme.py 주석).
        # 파일이 없거나 가변축 지정이 안 되면 원인을 여기서 명확히 드러낸다.
        run: |
          python - <<'PY'
          from scripts.insta_cards import theme
          font = theme.get_font("extrabold", 72)
          width = font.getlength("최근 7일 새로 포착된 최고가는 57억 5,000만원")
          assert width > 0, "폰트 폭 측정 실패"
          print(f"font ok: {theme.FONT_PATH} (샘플 폭 {width:.0f}px)")
          PY
      - name: Run script tests
        # DB·네트워크 의존 없음 — 외부 호출은 전부 테스트에서 patch 된다.
        run: python -m unittest discover -s scripts/tests -t . -v
