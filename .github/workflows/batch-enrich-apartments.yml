name: Enrich New Apartments

# 자동 트리거 종료 (2026-07-28).
#   - batch.run --type trade 가 이미 enrich_new_apartments 를 호출한다 (batch/run.py)
#     → 12h 거래 배치가 신규 아파트 보충을 담당하므로 별도 자동 실행은 중복
#   - 트리거 소스였던 Initial Nationwide Trade Collection 도 정기 스케줄을 종료
# 거래 배치 밖에서 보충만 따로 돌려야 할 때 workflow_dispatch 로 수동 실행.
on:
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install psycopg2-binary requests python-dotenv pandas joblib numpy scikit-learn
      - name: Enrich new apartments
        run: python -m batch.trade.enrich_apartments
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
