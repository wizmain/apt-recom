name: Fill Missing Apartment Addresses

# 정기 스케줄 종료 (2026-07-28).
#   - "Phase 2 대상: 0건" 이 최소 2026-06-28 이후 매일 반복
#   - batch/fill_addresses.py phase2 는 체크포인트(pnu > last_pnu) 이후만 조회하므로
#     체크포인트 이전의 미보충분은 정기 실행으로 재시도되지 않는다 → 계속 0건
# 잔여분 보충은 일회성 작업으로 처리한다 (Phase 1 수동 실행 / 체크포인트 리셋 후 Phase 2).
on:
  workflow_dispatch:

jobs:
  fill-addresses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install psycopg2-binary requests python-dotenv
      - name: Run Phase 2 - Building Registry API (max 950 calls)
        run: python -m batch.fill_addresses --phase 2 --max-calls 950
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
