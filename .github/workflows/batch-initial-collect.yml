name: Initial Nationwide Trade Collection

# 초기 수집 완료로 정기 스케줄 종료 (2026-07-28).
#   - 진행률 101% (전체 7353쌍 / 완료 7433쌍 / 남은 0쌍), 최소 2026-05-29 이후 계속 0쌍
#   - 신규 월은 Trade Data Batch (12h) 가 커버하므로 정기 실행이 불필요
# 신규 시군구 편입 등으로 미수집 구간이 생기면 workflow_dispatch 로 수동 실행.
on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install psycopg2-binary requests python-dotenv pandas
      - name: Run initial collection (max 900 calls)
        run: python -m batch.initial_collect --max-calls 900 --skip-enrich
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_API_KEY: ${{ secrets.KAKAO_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
